openapi: 3.1.0
info:
  title: Subcontracting Plan Reports API
  description: Modernized eSRS (Electronic Subcontracting Reporting System) backend
    microservice for SAM.gov. Provides RESTful APIs for managing subcontracting plan
    reports with Role-Based Access Control (RBAC) and UEI-based data filtering.
  contact:
    name: GSA IAE SAM.gov
    url: https://sam.gov
    email: sam-support@gsa.gov
  license:
    name: US Government Work
    url: https://www.usa.gov/
  version: "63.2"
tags:
  - name: Report Search
    description: Search submitted reports
paths:
  /spr/v1/search:
    post:
      tags:
        - open-gsa-controller
      operationId: getAwardDetails
      security:
        - basicAuth: []
      parameters:
        - name: api_key
          in: query
          required: true
          schema:
            type: string
        - name: X-Api-Roles
          in: header
          required: false
          description: Role header for authorization (must contain SA-FED-ALL)
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
components:
  schemas:
    SearchRequest:
      type: object
      properties:
        q:
          type: string
        includeSections:
          type: string
        submitter:
          type: string
        uniqueEntityID:
          type: string
        legalBusinessName:
          type: string
        ultimateParentUniqueEntityID:
          type: string
        piid:
          type: string
        referencedIdvPiid:
          type: string
        subcontractNumber:
          type: string
        organizationCode:
          type: string
        reportSubmittedDate:
          type: string
        reportingFiscalYear:
          type: string
        reportType:
          type: string
        reportingPeriod:
          type: string
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 1
